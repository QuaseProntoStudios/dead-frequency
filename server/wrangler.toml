# Servidor multiplayer do Dead Frequency.
# Deploy:  npx wrangler login  →  npm run deploy
# Painel:  npx wrangler secret put ADMIN_TOKEN   →  https://dead-frequency.teuzin0dev.workers.dev/admin
name = "dead-frequency"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Uma sala = um Durable Object.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

# Registro global (painel de admin): resumo das salas e totais.
[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

# Durable Objects com SQLite funcionam no plano gratuito da Cloudflare.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registry"]
