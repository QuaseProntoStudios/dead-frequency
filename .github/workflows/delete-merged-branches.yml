name: Delete merged feature branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-merged-branch:
    name: Delete merged source branch
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete source branch when safe
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const sourceRepo = pr.head.repo?.full_name;
            const protectedBranches = new Set(['main', 'Internal', 'historico']);
            const protectedPrefixes = ['hotfix/', 'release/'];

            if (sourceRepo !== context.repo.owner + '/' + context.repo.repo) {
              core.info('Source branch belongs to another repository; skipping.');
              return;
            }

            if (protectedBranches.has(branch) || protectedPrefixes.some(prefix => branch.startsWith(prefix))) {
              core.info(`Protected branch "${branch}"; skipping deletion.`);
              return;
            }

            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`
            });
            core.info(`Deleted merged branch "${branch}".`);
